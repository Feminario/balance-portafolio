<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance de Portafolio · Feminario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Colores oficiales — Feminario_ManualDeIdentidad.pdf, sección "Colores Corporativos" */
    --morado: #7E84AE;
    --periwinkle: #C2CBFF;
    --lavanda: #CEA2DD;
    --verde: #DFF3AF;
    /* Derivados del morado de marca, para texto y fondos (el manual no define estos, se derivan por contraste) */
    --morado-oscuro: #4C4F68;
    --morado-suave: #9AA0C7;
    --crema: #F8F7F2;
    --blanco: #FFFFFF;
    --texto: #3A3550;
    --bien: #3E8F63;
    --alerta: #B24A72;
    --vidrio: rgba(255,255,255,0.68);
    --vidrio-borde: rgba(255,255,255,0.55);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
    line-height: 1.55;
    position: relative;
    overflow-x: hidden;
  }
  /* ---- Fondo "liquid": manchas grandes difuminadas en los colores de marca ---- */
  .blob{ position: fixed; border-radius: 50%; filter: blur(60px); z-index:-1; opacity:.55; }
  .blob-1{ width: 520px; height: 520px; background: var(--periwinkle); top: -180px; left: -160px; }
  .blob-2{ width: 460px; height: 460px; background: var(--lavanda); top: 30%; right: -220px; opacity:.45; }
  .blob-3{ width: 420px; height: 420px; background: var(--verde); bottom: -180px; left: -140px; opacity:.4; }
  .blob-4{ width: 300px; height: 300px; background: var(--morado); bottom: 10%; right: -120px; opacity:.18; }

  #app{ max-width: 600px; margin: 0 auto; padding: 32px 18px 60px; position:relative; }

  .brand-header{ display:flex; align-items:center; justify-content:center; margin-bottom: 10px; }
  .brand-icon{ height: 52px; width:auto; display:block; }
  .titulo-tool{ text-align:center; font-size: 25px; font-weight: 800; color: var(--morado-oscuro); margin: 0 0 24px; letter-spacing:-0.3px; }

  .card{
    background: var(--vidrio);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--vidrio-borde);
    border-radius: 30px; padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(76,79,104,0.16), 0 2px 8px rgba(76,79,104,0.06);
    margin-bottom: 18px;
  }
  h2{ color: var(--morado-oscuro); font-size: 22px; margin-top:0; font-weight:800; letter-spacing:-0.2px; }
  h3{ color: var(--morado); font-size: 16px; margin-bottom: 8px; font-weight:800; }
  p{ margin: 0 0 14px; }
  .lead{ font-size: 15.5px; }
  .microcopy{ font-size:13px; color:var(--morado-oscuro); background: rgba(194,203,255,0.35); border-radius:14px; padding:12px 16px; margin: 0 0 18px; }

  label{ display:block; font-weight: 700; font-size: 13.5px; color: var(--morado-oscuro); margin: 16px 0 6px; }
  label.sublabel{ margin: 12px 0 4px; font-size:12.5px; }
  input[type="text"], input[type="number"], input[type="email"], select{
    width:100%; padding: 13px 16px; border-radius: 16px; border: 1.5px solid rgba(126,132,174,0.28);
    font-size: 15px; background: rgba(255,255,255,0.85); font-family: inherit; color: var(--texto);
  }
  input:focus, select:focus{ outline: none; border-color: var(--morado); box-shadow: 0 0 0 3px rgba(126,132,174,0.18); }
  small.help{ display:block; color:var(--morado-suave); font-size:12.5px; margin-top:6px; }

  .btn{
    display:inline-block; width:100%; text-align:center;
    background: linear-gradient(135deg, var(--morado), #8f8bc4);
    color: #fff; border:none; padding: 16px 18px; border-radius: 999px; font-size: 15.5px; font-weight: 700;
    cursor:pointer; margin-top: 22px; transition: transform .12s, box-shadow .15s;
    text-decoration:none; font-family: inherit; box-shadow: 0 10px 24px rgba(126,132,174,0.4);
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 14px 28px rgba(126,132,174,0.5); }
  .btn:active{ transform: scale(0.98); }
  .btn.secundario{ background: rgba(126,132,174,0.12); color: var(--morado-oscuro); box-shadow:none; border: 1.5px solid rgba(126,132,174,0.3); }
  .btn.secundario:hover{ background: rgba(126,132,174,0.2); transform:none; }
  .btn.chico{ padding:11px 16px; font-size:13.5px; margin-top:12px; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }

  .pregunta-bloque{ margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid rgba(126,132,174,0.15); }
  .pregunta-bloque:last-of-type{ border-bottom:none; }
  .pregunta-texto{ font-weight:800; font-size:15px; color:var(--morado-oscuro); margin-bottom:10px; }
  .opciones{ display:flex; flex-direction:column; gap:9px; }
  .opcion{ border:1.5px solid rgba(126,132,174,0.25); border-radius:16px; padding:13px 16px; cursor:pointer; font-size:14.5px; transition: all .15s; background: rgba(255,255,255,0.5); }
  .opcion:hover{ border-color: var(--morado); }
  .opcion.sel{ border-color: var(--morado); background: linear-gradient(135deg, rgba(194,203,255,0.55), rgba(206,162,221,0.4)); font-weight:700; color:var(--morado-oscuro); }

  .cat-group{ margin-bottom: 6px; padding: 16px 0; border-bottom: 1px solid rgba(126,132,174,0.15); }
  .cat-group:last-child{ border-bottom:none; }
  .cat-titulo{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:14.5px; color:var(--morado-oscuro); }
  .cat-swatch{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .cat-help{ font-size:13px; color:var(--morado-suave); margin: 4px 0 10px; }

  .tasa-box{ background: rgba(223,243,175,0.35); border-radius: 18px; padding: 16px 18px; margin-bottom: 18px; }
  .tasa-box label{ margin-top:0; }
  .tasa-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tasa-grid label{ font-size:12.5px; margin:0 0 4px; }

  /* Lista de montos con moneda (COP/USD/EUR), varias filas por categoría */
  .monto-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .monto-input{ flex:2; min-width:0; }
  .moneda-select{ flex:1; min-width:74px; padding:13px 8px; }
  .monto-del{ background:none; border:none; color:var(--alerta); font-size:18px; line-height:1; cursor:pointer; padding:6px; flex-shrink:0; }

  /* Holdings de inversión de mercado */
  .holding-row{ background: rgba(255,255,255,0.55); border-radius:18px; padding:14px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
  .holding-ticker{ width:100%; }
  .holding-tipo{ width:100%; }
  .holding-del{ align-self:flex-start; background:none; border:none; color:var(--alerta); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:0; }

  .paso-nota{ text-align:center; font-size:12.5px; color:var(--morado-suave); margin: 6px 0 0; }
  .progreso{ margin-top: 22px; }
  .paso-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:8px; }
  .paso-dot{ width:8px; height:8px; border-radius:50%; background: rgba(126,132,174,0.22); }
  .paso-dot.activo{ background: var(--morado); }
  .paso-texto{ text-align:center; font-size:12px; color:var(--morado-suave); }

  /* Resultado */
  .patrimonio-hero{
    text-align:center; background: linear-gradient(135deg, rgba(194,203,255,0.55), rgba(206,162,221,0.5));
    border-radius: 24px; padding: 26px 20px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .patrimonio-hero .rotulo{ font-size:12.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--morado-oscuro); font-weight:700; }
  .patrimonio-hero .monto{ font-size:36px; font-weight:800; color:var(--morado-oscuro); margin: 6px 0; letter-spacing:-0.5px; }
  .patrimonio-hero .desglose{ font-size:13.5px; color:var(--morado-oscuro); opacity:.75; }

  .stack-bar{ display:flex; width:100%; height:40px; border-radius:14px; overflow:hidden; background:rgba(126,132,174,0.12); }
  .stack-seg{ display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800;
    white-space:nowrap; overflow:hidden; border-right: 2px solid rgba(255,255,255,0.7); }
  .stack-seg:last-child{ border-right:none; }
  .legend{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .legend-item{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .legend-swatch{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .legend-label{ flex:1; color:var(--morado-oscuro); font-weight:600; }
  .legend-val{ color:var(--morado-suave); font-weight:700; white-space:nowrap; }
  .holdings-resumen{ font-size:13px; color:var(--morado-oscuro); background: rgba(255,255,255,0.5); border-radius:14px; padding:12px 16px; margin-top:12px; }

  .perfil-card{ background: linear-gradient(135deg, rgba(206,162,221,0.55), rgba(194,203,255,0.4)); border-radius: 22px; padding: 22px; margin: 18px 0; }
  .perfil-nombre{ font-size:19px; font-weight:800; color:var(--morado-oscuro); margin-bottom:6px; }
  .meta-card{ background: rgba(223,243,175,0.4); border-radius:16px; padding:14px 18px; margin: 14px 0; font-size:14px; }
  .meta-card b{ color:var(--morado-oscuro); }

  .arquetipo-card{
    background: linear-gradient(135deg, rgba(194,203,255,0.6), rgba(206,162,221,0.45));
    border-radius: 22px; padding: 22px; margin: 18px 0;
  }
  .arquetipo-nombre{ font-size:20px; font-weight:800; color:var(--morado-oscuro); margin-bottom:6px; }

  .coherencia-box{ border-radius:18px; padding:18px 20px; margin:16px 0; font-size:14px; }
  .coherencia-ok{ background: rgba(62,143,99,0.12); border: 1px solid rgba(62,143,99,0.35); }
  .coherencia-alerta{ background: rgba(178,74,114,0.1); border: 1px solid rgba(178,74,114,0.35); }
  .coherencia-titulo{ font-weight:800; font-size:15px; color:var(--morado-oscuro); margin-bottom:6px; }

  .tip{
    background: rgba(255,255,255,0.55); border-radius: 16px;
    padding: 13px 16px; margin-bottom: 10px; font-size: 14px; color: var(--morado-oscuro);
    border-left: 4px solid var(--morado);
  }

  .comparativo{ background: rgba(255,255,255,0.5); border-radius:18px; padding:18px 20px; margin: 16px 0; }
  .comparativo .fila{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
  .comparativo .fila b{ color:var(--morado-oscuro); }
  .sube{ color: var(--bien); font-weight:800; }
  .baja{ color: var(--alerta); font-weight:800; }
  .sparkline-wrap{ text-align:center; margin-top:10px; }

  .explorar{ background: linear-gradient(135deg, rgba(126,132,174,0.16), rgba(206,162,221,0.28)); border-radius: 24px; padding: 24px 22px; margin-top: 12px; }
  .explorar h3{ color: var(--morado-oscuro); }
  .explorar p{ color: var(--morado-oscuro); font-size:14px; opacity:.85; }

  .footer-nota{ text-align:center; font-size: 12px; color: var(--morado-suave); margin-top: 22px; line-height:1.5; }
  .link-volver{ display:block; width:100%; text-align:center; margin-top:14px; font-size:13.5px; color:var(--morado); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-family:inherit; }
</style>
</head>

function calcularPerfilRiesgo(respuestas){
  const score = Object.values(respuestas).reduce((a,b)=>a+n(b), 0);
  let categoria, descripcion;
  if(score <= 12){
    categoria = "Conservadora";
    descripcion = "Prefieres proteger lo que tienes antes que arriesgarte a que crezca mucho. No hay nada de malo en eso — solo hay que asegurarse de que no sea tan conservador que la inflación se coma tu plata en silencio.";
  } else if(score <= 18){
    categoria = "Moderada";
    descripcion = "Buscas un balance: que tu plata crezca, pero sin sustos grandes. Puedes tolerar algo de vaivén si el plan detrás tiene sentido.";
  } else {
    categoria = "Arriesgada";
    descripcion = "Estás dispuesta a ver bajones en el camino con tal de buscar más crecimiento. Ojo: arriesgada no es lo mismo que impulsiva — el riesgo funciona cuando tiene un plan y un colchón detrás.";
  }
  return { score, categoria, descripcion };
}

/* ============================================================
   ESTADO — perfil + historial mensual en localStorage del
   navegador. El respaldo real (para tu información agregada y
   para diseñar las sesiones del curso) vive en tu Google Sheet
   vía SHEET_WEBAPP_URL.
   OJO: el historial mes a mes solo se ve en el mismo navegador/

   desde otro celular, no va a ver su historial anterior en
   pantalla — eso sí queda guardado en tu Sheet, pero no hay
   forma de traerlo de vuelta a la pantalla sin un login real
   (posible fase futura).
   ============================================================ */
const STORAGE_KEY = "fem_balance_portafolio_v4";
function getState(){ try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveState(state){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function enviarABaseDeDatos(payload){
  if(!SHEET_WEBAPP_URL){ console.log("[Balance de Portafolio] Sin SHEET_WEBAPP_URL configurada. Datos solo guardados localmente:", payload); return; }
  fetch(SHEET_WEBAPP_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) })
    .catch(err => console.log("[Balance de Portafolio] Error al enviar a la base de datos:", err));
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function n(v){ return Number(v) || 0; }
function cop(v){ v = Number(v) || 0; const signo = v < 0 ? "-" : ""; return signo + "$" + Math.round(Math.abs(v)).toLocaleString("es-CO"); }
function pct(v){ return Math.round(v*100); }
function esc(s){ return (s || "").toString().replace(/"/g, "&quot;"); }
function alertaSuave(msg){
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4C4F68;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:99;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

function header(){

      <img class="brand-icon" src="data:image/png;base64,${ICON_B64}" alt="Feminario">
    </div>
    <div class="titulo-tool">Balance de Portafolio</div>`;
}
function progreso(paso, total){
  let dots = "";
  for(let i=1;i<=total;i++){ dots += `<span class="paso-dot ${i<=paso?'activo':''}"></span>`; }
  return `<div class="progreso"><div class="paso-dots">${dots}</div><div class="paso-texto">Paso ${paso} de ${total}</div></div>`;
}

/* ============================================================
   MONEDA — cada categoría de plata puede tener varios montos en
   distintas monedas a la vez (ej: parte de tu Fondo de Autonomía
   en pesos y otra parte en dólares). Guardamos una lista de
   {monto, moneda} por categoría y convertimos todo a COP con las
   tasas que ella misma define, solo para poder sumar y sacar
   porcentajes. Sus valores originales quedan intactos.
   ============================================================ */
let draftListas = {};
function entradaVacia(){ return { monto:"", moneda:"COP" }; }
function inicializarLista(id){
  draftListas[id] = (draft[id] && draft[id].length) ? draft[id].map(e=>({...e})) : [entradaVacia()];
}
function renderListaMonto(id, placeholder){
  const entradas = draftListas[id] && draftListas[id].length ? draftListas[id] : [entradaVacia()];
  return `<div id="lista-${id}">
    ${entradas.map((e,i) => `
      <div class="monto-row">
        <input type="number" class="monto-input" placeholder="${placeholder||'0'}" value="${e.monto||''}" oninput="draftListas['${id}'][${i}].monto=this.value">
        <select class="moneda-select" onchange="draftListas['${id}'][${i}].moneda=this.value">
          ${MONEDAS.map(m => `<option value="${m}" ${e.moneda===m?'selected':''}>${m}</option>`).join("")}
        </select>
        ${entradas.length>1 ? `<button type="button" class="monto-del" onclick="quitarEntradaLista('${id}',${i})" aria-label="Quitar">✕</button>` : ""}
      </div>
    `).join("")}
    <button type="button" class="btn secundario chico" onclick="agregarEntradaLista('${id}')">+ Agregar otro monto</button>
  </div>`;
}
function agregarEntradaLista(id){
  draftListas[id].push(entradaVacia());
  document.getElementById("lista-"+id).outerHTML = renderListaMonto(id);
}
function quitarEntradaLista(id, i){
  draftListas[id].splice(i,1);
  if(draftListas[id].length===0) draftListas[id] = [entradaVacia()];
  document.getElementById("lista-"+id).outerHTML = renderListaMonto(id);
}
function leerLista(id){
  return (draftListas[id]||[]).filter(e => n(e.monto) > 0).map(e => ({ monto: n(e.monto), moneda: e.moneda || "COP" }));
}
function enCop(entrada, tasas){
  if(!entrada) return 0;
  const monto = n(entrada.monto);
  if(entrada.moneda === "USD") return monto * n(tasas.usd);
  if(entrada.moneda === "EUR") return monto * n(tasas.eur);
  return monto;
}
function sumaListaCop(lista, tasas){ return (lista||[]).reduce((s,e) => s + enCop(e, tasas), 0); }
function formatoMonto(e){
  const val = Math.round(n(e.monto)).toLocaleString("es-CO");
  if(e.moneda === "USD") return "US$" + val;
  if(e.moneda === "EUR") return "€" + val;
  return "$" + val;
}
function detalleLista(lista){ return (lista||[]).filter(e => n(e.monto) > 0).map(formatoMonto).join(" + "); }

/* ============================================================
   HOLDINGS DE INVERSIÓN DE MERCADO — en vez de un solo monto,

let draftHoldings = [];

        <select class="moneda-select" onchange="draftHoldings[${i}].moneda=this.value">

function eliminarHolding(i){ draftHoldings.splice(i,1); document.getElementById("holdings-mercado").innerHTML = renderHoldingsHTML(); }

/* ============================================================
   CÁLCULO DE PORTAFOLIO — arma el snapshot del mes con activos,
   pasivos, patrimonio neto, meses de colchón, apalancamiento,
   concentración y el arquetipo de balance/diversificación.
   Todos los valores se convierten a COP con las tasas indicadas
   para poder sumarlos; el detalle original (montos y monedas
   por separado) se guarda en snapshot.raw para el próximo corte
   y para el export a tu Excel.
   ============================================================ */
function calcularSnapshot(draft, tasas){
  tasas = { usd: n(tasas.usd) || 4000, eur: n(tasas.eur) || 4300 };
  const activos = {
    liquidez: sumaListaCop(draft.liquidez, tasas),
    rentaFija: sumaListaCop(draft.rentaFija, tasas),
    pension: sumaListaCop(draft.pension, tasas),
    vivienda: sumaListaCop(draft.viviendaPropia, tasas) + sumaListaCop(draft.viviendaInversion, tasas),
    mercado: (draft.mercadoHoldings||[]).reduce((s,h)=> s + enCop(h, tasas), 0),
    negocio: sumaListaCop(draft.negocio, tasas),
    otros: sumaListaCop(draft.vehiculo, tasas) + sumaListaCop(draft.otrosActivos, tasas),
  };
  const activosDetalle = {
    viviendaPropia: sumaListaCop(draft.viviendaPropia, tasas), viviendaInversion: sumaListaCop(draft.viviendaInversion, tasas),
    vehiculo: sumaListaCop(draft.vehiculo, tasas), otrosActivos: sumaListaCop(draft.otrosActivos, tasas),
  };
  const pasivos = {};
  DEBT_CATS.forEach(c => pasivos[c.key] = sumaListaCop(draft[c.key], tasas));
  const gastoMensual = sumaListaCop(draft.gastoMensual, tasas);

  const totalActivos = Object.values(activos).reduce((a,b)=>a+b, 0);
  const totalPasivos = Object.values(pasivos).reduce((a,b)=>a+b, 0);
  const patrimonioNeto = totalActivos - totalPasivos;
  const mesesColchon = gastoMensual > 0 ? Math.round((activos.liquidez / gastoMensual)*10)/10 : 0;
  const relacionDeudaActivos = totalActivos > 0 ? totalPasivos/totalActivos : (totalPasivos>0 ? 1 : 0);

  let maxCat = null, maxPct = 0;
  ASSET_CATS.forEach(cat=>{
    const p = totalActivos>0 ? activos[cat.key]/totalActivos : 0;
    if(p > maxPct){ maxPct = p; maxCat = cat.key; }
  });
  const bucketsConPresencia = ASSET_CATS.filter(cat => totalActivos>0 && (activos[cat.key]/totalActivos) >= 0.05).length;
  const sinLargoPlazo = (activos.pension + activos.mercado) <= 0;

  let arquetipo, mensaje, tips = [];

  if(totalActivos <= 0 && totalPasivos <= 0){
    arquetipo = "La Que Empieza Desde Cero";
    mensaje = "Hoy no tienes activos registrados todavía — y está bien. Este primer corte es tu línea base: todo lo que venga de aquí en adelante ya es progreso que vas a poder medir.";
    tips = [
      "Tu primer paso no es invertir, es armar tu Fondo de Autonomía, aunque sea con " + cop(20000) + " esta semana.",
      "Vuelve a hacer este corte el próximo mes — la comparación es lo que te va a mostrar que sí estás avanzando."
    ];
  } else if(gastoMensual > 0 && mesesColchon < 1){
    arquetipo = "La Sin Red de Seguridad";
    mensaje = `Tienes ${cop(patrimonioNeto)} de patrimonio neto, pero solo ${mesesColchon} meses de colchón. Así tengas otras cosas (vivienda, pensión, inversión), si hoy te quedas sin ingreso no tienes con qué cubrir lo básico sin vender algo o endeudarte.`;
    tips = [
      `Antes de meterle más a inversión o a pagar deuda extra, prioriza juntar al menos 1 mes de gastos (${cop(gastoMensual)}) en liquidez inmediata.`,
      "Revisa si alguno de tus otros activos (un CDT que ya cumplió plazo, por ejemplo) puede pasar a liquidez sin perder mucho."
    ];
  } else if(maxPct >= 0.7 && maxCat === "vivienda"){
    arquetipo = "La Casa-Fuerte";
    mensaje = `El ${pct(maxPct)}% de tu patrimonio está en vivienda. Es un activo real y valioso, pero no es líquido: no lo puedes usar rápido si necesitas plata ya.`;
    tips = [
      "Como tu colchón está cubierto, el siguiente paso es empezar a construir algo líquido o de mercado por fuera del ladrillo, así no dependes de vender o hipotecar la casa ante un imprevisto.",
      "Con el tiempo, ninguna categoría debería pesar más del 60-70% de tu patrimonio — ni siquiera la vivienda."
    ];
  } else if(maxPct >= 0.7 && (maxCat === "liquidez" || maxCat === "rentaFija")){
    arquetipo = "La Guardiana Cautelosa";
    mensaje = `El ${pct(maxPct)}% de tu patrimonio está en efectivo o CDT. Tu plata está segura, pero una parte importante no está creciendo a largo plazo.`;
    tips = [
      "Con tu colchón ya cubierto, destina un % fijo de lo nuevo que ahorres a pensión voluntaria o a un fondo de inversión, así ese dinero también trabaja para ti.",
      "No se trata de mover todo de golpe: empieza con un monto pequeño y constante cada mes."
    ];
  } else if(relacionDeudaActivos >= 0.4){
    arquetipo = "La Apalancada";
    mensaje = `Tu deuda equivale al ${pct(relacionDeudaActivos)}% de todo lo que tienes. Antes de pensar en invertir más, vale la pena mirar si esa deuda te está costando más de lo que te está rindiendo cualquier otra cosa.`;
    tips = [
      "Identifica cuál de tus deudas tiene la tasa más alta (usualmente la tarjeta de crédito) y ponla de primera en tu plan de pago.",
      "Si tu deuda es sobre todo hipotecaria con una tasa razonable, no es urgente — el problema real es la deuda cara de consumo, no toda deuda por igual."
    ];
  } else if(sinLargoPlazo && mesesColchon >= 3){
    arquetipo = "La Segura de Hoy, Corta de Mañana";
    mensaje = "Tu día a día está bien cubierto: tienes colchón y no estás endeudada de más. Pero no tienes nada en pensión voluntaria ni en mercado — nada está creciendo pensando en los próximos 10 o 20 años.";
    tips = [
      "Aunque sea un monto pequeño y constante, empezar hoy en pensión voluntaria o en un fondo de inversión le da tiempo al interés compuesto, que es lo que realmente hace la diferencia.",
      "No necesitas saber de mercados para empezar — necesitas empezar para aprender."
    ];
  } else if(bucketsConPresencia >= 4 && mesesColchon >= 3 && relacionDeudaActivos < 0.4 && maxPct < 0.6){
    arquetipo = "La Estratega Diversificada";
    mensaje = "Tu patrimonio está repartido en varios frentes, tu colchón está en un buen rango y tu deuda no te está ahogando. Esto no significa que ya no hay nada que mejorar, pero sí que tienes una base sólida.";
    tips = [
      "El siguiente nivel ya no es \"tener de todo\" — es revisar si cada parte está en su mejor versión posible (tasas, costos, diversificación dentro de cada categoría).",
      "Repite este corte cada mes: a este nivel, lo que importa es mantener el balance, no solo haberlo logrado una vez."
    ];
  } else {
    arquetipo = "La Que Va Armando el Rompecabezas";
    mensaje = "Ya tienes varias piezas puestas — no estás empezando de cero, pero tampoco está todo balanceado todavía. Vamos por partes.";
    const candidatos = [];
    if(gastoMensual > 0 && mesesColchon < 3) candidatos.push(`Tu colchón está en ${mesesColchon} meses — la meta recomendada es 3 a 6. Eso va primero.`);
    if(sinLargoPlazo) candidatos.push("No tienes nada en pensión voluntaria ni en mercado — es tu oportunidad de crecimiento a más largo plazo.");
    if(maxPct >= 0.5) candidatos.push(`El ${pct(maxPct)}% de tu patrimonio está concentrado en una sola categoría — vale la pena repartir un poco más.`);
    if(relacionDeudaActivos >= 0.25) candidatos.push(`Tu deuda equivale al ${pct(relacionDeudaActivos)}% de tus activos — no es crítico, pero mantenla vigilada.`);
    if(candidatos.length === 0) candidatos.push("Vas bien encaminada — sigue sumando un poco cada mes a las categorías donde tienes menos.");
    tips = candidatos.slice(0,2);
  }

  const raw = {
    liquidez: draft.liquidez, rentaFija: draft.rentaFija, pension: draft.pension,
    viviendaPropia: draft.viviendaPropia, viviendaInversion: draft.viviendaInversion,
    mercadoHoldings: draft.mercadoHoldings || [],
    negocio: draft.negocio, vehiculo: draft.vehiculo, otrosActivos: draft.otrosActivos,
    tarjetas: draft.tarjetas, hipotecario: draft.hipotecario, vehiculoCredito: draft.vehiculoCredito,
    personales: draft.personales, educativo: draft.educativo, informal: draft.informal, otrasDeudas: draft.otrasDeudas,
    gastoMensual: draft.gastoMensual, tasaUSD: tasas.usd, tasaEUR: tasas.eur
  };

  return {
    fecha: new Date().toISOString(),
    tasaUSD: tasas.usd, tasaEUR: tasas.eur, raw,
    gastoMensual,
    activos, activosDetalle, pasivos,
    totales: { totalActivos, totalPasivos, patrimonioNeto },
    mesesColchon, relacionDeudaActivos,
    concentracion: { categoria: maxCat, porcentaje: maxPct },
    bucketsConPresencia,
    arquetipo, mensaje, tips
  };
}

/* ============================================================
   COHERENCIA — cruza perfil de riesgo + meta con la composición
   real del portafolio. Este es el segundo diagnóstico (distinto
   del balance/diversificación): no pregunta "¿está balanceado?"
   sino "¿esto tiene sentido para lo que ella dijo que quiere y
   tolera?".
   ============================================================ */
function evaluarCoherencia(perfilRiesgo, metas, activos, totalActivos){
  if(!perfilRiesgo || !metas || totalActivos <= 0) return null;
  const pctMercado = activos.mercado / totalActivos;
  const pctConservador = (activos.liquidez + activos.rentaFija) / totalActivos;
  const pctLargoPlazo = (activos.mercado + activos.pension) / totalActivos;
  const horizonteLargo = metas.horizonte === "Entre 3 y 7 años" || metas.horizonte === "Más de 7 años";
  const horizonteCorto = metas.horizonte === "Menos de 1 año";

  if(perfilRiesgo.categoria === "Conservadora" && pctMercado > 0.4){
    return { estado:"alerta", titulo:"Tu portafolio tiene más riesgo del que dijiste tolerar",
      mensaje:`Te definiste como de perfil <b>conservador</b>, pero el ${pct(pctMercado)}% de tu patrimonio está en inversión de mercado. Si un bajón fuerte te quita el sueño (según lo que respondiste), vale la pena revisar si ese porcentaje es demasiado para ti hoy.` };
  }
  if(horizonteCorto && pctMercado > 0.3){
    return { estado:"alerta", titulo:"Tu meta es de corto plazo, pero tu plata está expuesta al mercado",
      mensaje:`Dijiste que quieres lograr "<b>${esc(metas.principal)}</b>" en menos de 1 año, y el ${pct(pctMercado)}% de tu patrimonio está en inversión de mercado. El riesgo es necesitar esa plata justo cuando el mercado esté en un mal momento.` };
  }
  if((perfilRiesgo.categoria === "Arriesgada" || horizonteLargo) && pctLargoPlazo < 0.15 && pctConservador > 0.6){
    return { estado:"alerta", titulo:"Podrías estar dejando crecimiento sobre la mesa",
      mensaje:`Tu perfil o el horizonte de tu meta permiten buscar más crecimiento, pero el ${pct(pctConservador)}% de tu patrimonio está en efectivo o CDT. Con un horizonte largo, esa plata podría estar trabajando más para ti.` };
  }
  return { estado:"ok", titulo:"Tu portafolio va en línea con tu perfil",
    mensaje:`Para un perfil <b>${perfilRiesgo.categoria.toLowerCase()}</b> y tu meta de "<b>${esc(metas.principal)}</b>", la forma en que tienes repartida tu plata tiene sentido. Eso no quita que revisemos el balance general más abajo — coherente con tu perfil no siempre es lo mismo que bien diversificado.` };
}

/* ============================================================
   COMPONENTES VISUALES — barra apilada de composición, leyenda
   y mini-gráfico de tendencia (línea) para comparar meses.
   ============================================================ */
function renderStackBar(activos, totalActivos){
  if(totalActivos <= 0) return `<div class="stack-bar"></div>`;
  const visibles = ASSET_CATS.filter(cat => activos[cat.key] > 0);
  const segs = visibles.map((cat, i)=>{
    const p = activos[cat.key] / totalActivos;
    const estiloRadio = visibles.length===1 ? "border-radius:14px;" : (i===0 ? "border-radius:14px 0 0 14px;" : (i===visibles.length-1 ? "border-radius:0 14px 14px 0;" : ""));
    return `<div class="stack-seg" style="width:${(p*100).toFixed(2)}%; background:${cat.color}; ${estiloRadio}" title="${cat.label}">${p>=0.12 ? pct(p)+"%" : ""}</div>`;
  }).join("");
  return `<div class="stack-bar">${segs}</div>`;
}
function renderLegend(activos, totalActivos){
  return ASSET_CATS.filter(cat => activos[cat.key] > 0).map(cat=>{
    const p = totalActivos>0 ? activos[cat.key]/totalActivos : 0;
    return `<div class="legend-item">
      <span class="legend-swatch" style="background:${cat.color}"></span>
      <span class="legend-label">${cat.label}</span>
      <span class="legend-val">${cop(activos[cat.key])} · ${pct(p)}%</span>
    </div>`;
  }).join("");
}
function renderHoldingsResumen(snapshot){
  const holdings = (snapshot.raw.mercadoHoldings||[]).filter(h => h.ticker && h.ticker.trim());
  if(holdings.length===0) return "";
  return `<div class="holdings-resumen"><b>Tu inversión de mercado incluye:</b> ${holdings.map(h=>`${esc(h.ticker)} (${esc(h.tipo)})`).join(" · ")}</div>`;
}
function renderSparkline(historial){
  if(historial.length < 2) return "";
  const ultimos = historial.slice(-6);
  const vals = ultimos.map(h => h.totales.patrimonioNeto);
  const w = 260, h = 56, pad = 8;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w-2*pad)/(vals.length-1);
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const color = vals[vals.length-1] >= vals[0] ? "#3E8F63" : "#B24A72";
  return `<div class="sparkline-wrap"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg><div style="font-size:11.5px;color:var(--morado-suave);">Tu patrimonio neto en tus últimos ${ultimos.length} cortes</div></div>`;
}

/* ============================================================
   EXPORT A GOOGLE SHEET / EXCEL — payload plano, con una columna
   por dato (no un solo JSON en una celda), pensado para que la
   hoja se pueda abrir y analizar directamente en Excel/Drive.
   Cada categoría de plata trae su total en COP más un "_detalle"
   en texto con los montos y monedas originales, por si tenía
   parte en pesos y parte en dólares o euros. Ver
   claude/club365-balance-portafolio.md para el código de Apps
   Script (doPost) que escribe estas columnas en tu Sheet.
   ============================================================ */
function construirPayloadPlano(state, snapshot, coherencia){
  const holdings = (snapshot.raw.mercadoHoldings||[]).filter(h => h.ticker && h.ticker.trim());
  const holdingsTexto = holdings.map(h => `${h.ticker} [${h.tipo}]: ${formatoMonto(h)}`).join(" · ");

  const payload = {
    tipo: "balance_portafolio",
    fecha: snapshot.fecha,
    nombre: state.nombre, email: state.email, whatsapp: state.whatsapp, edad: state.edad,
    perfilRiesgoCategoria: state.perfilRiesgo.categoria, perfilRiesgoScore: state.perfilRiesgo.score,
    metaPrincipal: state.metas.principal, metaHorizonte: state.metas.horizonte,
    metasSecundarias: (state.metas.secundarias||[]).join("; "),
    tasaUSD: snapshot.tasaUSD, tasaEUR: snapshot.tasaEUR,
    activo_mercado_cop: snapshot.activos.mercado,
    activo_mercado_detalle: holdingsTexto,
    totalActivos_cop: snapshot.totales.totalActivos,
    totalPasivos_cop: snapshot.totales.totalPasivos,
    patrimonioNeto_cop: snapshot.totales.patrimonioNeto,
    mesesColchon: snapshot.mesesColchon,
    relacionDeudaActivos: snapshot.relacionDeudaActivos,
    concentracionCategoria: snapshot.concentracion.categoria,
    concentracionPct: snapshot.concentracion.porcentaje,
    arquetipo: snapshot.arquetipo,
    coherenciaEstado: coherencia ? coherencia.estado : "",
    coherenciaTitulo: coherencia ? coherencia.titulo : ""
  };
  const tasas = { usd: snapshot.tasaUSD, eur: snapshot.tasaEUR };
  CAMPOS_SIMPLES.forEach(c => {
    payload[c.pref+"_cop"] = sumaListaCop(snapshot.raw[c.id], tasas);
    payload[c.pref+"_detalle"] = detalleLista(snapshot.raw[c.id]);
  });
  return payload;
}

/* ============================================================
   PANTALLA FINAL — RESULTADO
   ============================================================ */
function pantallaResultado(state, snapshot){
  const historialAnterior = state.historial.length >= 2 ? state.historial[state.historial.length - (state.historial[state.historial.length-1]===snapshot ? 2 : 1)] : null;
  let comparativoHtml = "";
  if(historialAnterior && historialAnterior !== snapshot){
    const deltaPatrimonio = snapshot.totales.patrimonioNeto - historialAnterior.totales.patrimonioNeto;
    const deltaMeses = Math.round((snapshot.mesesColchon - historialAnterior.mesesColchon)*10)/10;
    const fechaAnt = new Date(historialAnterior.fecha).toLocaleDateString("es-CO", { day:"numeric", month:"long" });
    comparativoHtml = `
      <div class="comparativo">
        <h3 style="margin-top:0;">Desde tu corte del ${fechaAnt}</h3>
        <div class="fila"><span>Patrimonio neto</span><b class="${deltaPatrimonio>=0?'sube':'baja'}">${deltaPatrimonio>=0?'+':''}${cop(deltaPatrimonio)}</b></div>
        <div class="fila"><span>Meses de colchón</span><b class="${deltaMeses>=0?'sube':'baja'}">${deltaMeses>=0?'+':''}${deltaMeses}</b></div>
        ${historialAnterior.arquetipo !== snapshot.arquetipo ? `<div class="fila"><span>Tu diagnóstico</span><b>pasó de "${historialAnterior.arquetipo}" a "${snapshot.arquetipo}"</b></div>` : ""}
        ${renderSparkline(state.historial)}
      </div>
    `;
  }

  const coherencia = evaluarCoherencia(state.perfilRiesgo, state.metas, snapshot.activos, snapshot.totales.totalActivos);
  const coherenciaHtml = coherencia ? `
    <h3>¿Tu portafolio va con tu perfil y tu meta?</h3>
    <div class="coherencia-box ${coherencia.estado==='ok'?'coherencia-ok':'coherencia-alerta'}">
      <div class="coherencia-titulo">${coherencia.titulo}</div>
      <p style="margin:0;">${coherencia.mensaje}</p>
    </div>
  ` : "";

  document.getElementById("app").innerHTML = `
    ${header()}
    <div class="card">
      <div class="perfil-card">
        <div class="perfil-nombre">Perfil de riesgo: ${state.perfilRiesgo.categoria}</div>
        <p style="margin:0;">${state.perfilRiesgo.descripcion}</p>
      </div>
      <div class="meta-card"><b>Tu meta principal:</b> ${esc(state.metas.principal)} · <b>en</b> ${esc(state.metas.horizonte).toLowerCase()}</div>

      <div class="patrimonio-hero">
        <div class="rotulo">Tu patrimonio neto</div>
        <div class="monto">${cop(snapshot.totales.patrimonioNeto)}</div>
        <div class="desglose">${cop(snapshot.totales.totalActivos)} en activos · ${cop(snapshot.totales.totalPasivos)} en deudas</div>
      </div>

      <h3>Así está compuesta tu plata</h3>
      ${renderStackBar(snapshot.activos, snapshot.totales.totalActivos)}
      <div class="legend">${renderLegend(snapshot.activos, snapshot.totales.totalActivos)}</div>
      ${renderHoldingsResumen(snapshot)}

      ${coherenciaHtml}

      <h3>¿Qué tan balanceado está?</h3>
      <div class="arquetipo-card">
        <div class="arquetipo-nombre">${snapshot.arquetipo}</div>
        <p style="margin:0;">${snapshot.mensaje}</p>
      </div>

      <h3>Qué mejorar</h3>
      ${snapshot.tips.map(t => `<div class="tip">${t}</div>`).join("")}

      ${comparativoHtml}

      <button class="btn" onclick="render()">Listo por ahora</button>

      <div class="explorar">
        <h3>Vuelve el próximo mes</h3>
        <p>Este balance vale más si lo repites — es la única forma de ver si tu mezcla realmente está mejorando. Guarda este link y vuelve en un mes.</p>
        <a class="btn" href="${LINK_EXPLORAR}" target="_blank" rel="noopener">Explorar más recursos de Feminario</a>
      </div>
      <div class="footer-nota">Este resultado es educativo, no es asesoría financiera personalizada ni una recomendación de inversión puntual.</div>
    </div>
  `;
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render(){
  const state = getState();
  if(!state){ pantallaBienvenida(); return; }
  if(!state.perfilRiesgo){ pantallaRiesgo(state); return; }
  if(!state.metas){ pantallaMetas(state); return; }
  if(!state.historial || state.historial.length === 0){ pantallaActivos(state); return; }
  pantallaRetorno(state);
}

render();
</script>
</body>
</html>
