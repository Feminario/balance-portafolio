<title>Mi Rango Objetivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --morado: #7E84AE;
    --periwinkle: #C2CBFF;
    --lavanda: #CEA2DD;
    --verde: #DFF3AF;
    --morado-oscuro: #4C4F68;
    --morado-suave: #9AA0C7;
    --crema: #F8F7F2;
    --superficie: #FFFFFF;
    --texto: #3A3550;
    --texto-suave: #6b6684;
    --bien: #3E8F63;
    --alerta: #B24A72;
    --vidrio: rgba(255,255,255,0.68);
    --vidrio-borde: rgba(255,255,255,0.6);
    --raices: #B08968;
    --tronco: #7E84AE;
    --ramas: #C2483D;
    --agua: #5A9BD5;
    --injerto: #CEA2DD;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --crema: #221f2e;
      --superficie: #2b2739;
      --texto: #ECE9F5;
      --texto-suave: #B6B0CC;
      --morado-oscuro: #E4E1F5;
      --morado-suave: #A9A3C9;
      --vidrio: rgba(255,255,255,0.06);
      --vidrio-borde: rgba(255,255,255,0.12);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --crema: #221f2e;
    --superficie: #2b2739;
    --texto: #ECE9F5;
    --texto-suave: #B6B0CC;
    --morado-oscuro: #E4E1F5;
    --morado-suave: #A9A3C9;
    --vidrio: rgba(255,255,255,0.06);
    --vidrio-borde: rgba(255,255,255,0.12);
    color-scheme: dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background:var(--crema); color:var(--texto); line-height:1.55;
  }
  #blobs{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; }
  .blob-1{ width:480px; height:480px; background:var(--periwinkle); top:-160px; left:-140px; }
  .blob-2{ width:420px; height:420px; background:var(--lavanda); top:20%; right:-200px; opacity:.28; }
  .blob-3{ width:380px; height:380px; background:var(--verde); bottom:-160px; left:-120px; opacity:.25; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .blob{ opacity:.12; } }
  :root[data-theme="dark"] .blob{ opacity:.12; }

  #app{ max-width:600px; margin:0 auto; padding: max(28px, env(safe-area-inset-top,0px)) 18px 60px; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
  .brand img{ height:40px; width:auto; }
  .eyebrow{ text-align:center; font-size:12.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--morado-suave); margin-bottom:4px; }
  .titulo-tool{ text-align:center; font-size:24px; font-weight:800; color:var(--morado-oscuro); margin:0 0 22px; letter-spacing:-0.3px; }

  .card{
    background:var(--vidrio); -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3);
    border:1px solid var(--vidrio-borde); border-radius:26px; padding:26px 22px; margin-bottom:16px;
    box-shadow:0 16px 40px rgba(76,79,104,0.12), 0 2px 8px rgba(76,79,104,0.05);
  }
  h2{ color:var(--morado-oscuro); font-size:21px; margin:0 0 10px; font-weight:800; letter-spacing:-0.2px; text-wrap:balance; }
  h3{ color:var(--morado); font-size:15px; margin:18px 0 8px; font-weight:800; }
  p{ margin:0 0 12px; }
  .lead{ font-size:15px; color:var(--texto-suave); }
  small.help{ display:block; color:var(--morado-suave); font-size:12.5px; margin-top:6px; }

  label{ display:block; font-weight:700; font-size:13.5px; color:var(--morado-oscuro); margin:14px 0 6px; }
  input[type="text"], input[type="email"], input[type="number"]{
    width:100%; padding:13px 16px; border-radius:16px; border:1.5px solid rgba(126,132,174,0.28);
    font-size:15px; background:var(--superficie); font-family:inherit; color:var(--texto);
  }
  input:focus{ outline:none; border-color:var(--morado); box-shadow:0 0 0 3px rgba(126,132,174,0.18); }
  textarea{
    width:100%; padding:13px 16px; border-radius:16px; border:1.5px solid rgba(126,132,174,0.28);
    font-size:14.5px; background:var(--superficie); font-family:inherit; color:var(--texto); resize:vertical; min-height:70px;
  }

  .btn{
    display:inline-block; width:100%; text-align:center; background:linear-gradient(135deg, var(--morado), #8f8bc4);
    color:#fff; border:none; padding:15px 18px; border-radius:999px; font-size:15px; font-weight:700;
    cursor:pointer; margin-top:18px; box-shadow:0 10px 24px rgba(126,132,174,0.35); font-family:inherit;
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.secundario{ background:rgba(126,132,174,0.12); color:var(--morado-oscuro); box-shadow:none; border:1.5px solid rgba(126,132,174,0.3); }
  .link-volver{ display:block; width:100%; text-align:center; margin-top:12px; font-size:13.5px; color:var(--morado); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-family:inherit; }

  .opciones{ display:flex; flex-direction:column; gap:8px; }
  .opcion{ border:1.5px solid rgba(126,132,174,0.25); border-radius:15px; padding:12px 15px; cursor:pointer; font-size:14px; background:var(--superficie); }
  .opcion.sel{ border-color:var(--morado); background:linear-gradient(135deg, rgba(194,203,255,0.5), rgba(206,162,221,0.35)); font-weight:700; color:var(--morado-oscuro); }
  :root[data-theme="dark"] .opcion.sel, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .opcion.sel{ background:linear-gradient(135deg, rgba(194,203,255,0.16), rgba(206,162,221,0.12)); } }

  .resumen-row{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid rgba(126,132,174,0.15); font-size:14px; }
  .resumen-row:last-child{ border-bottom:none; }
  .resumen-row .k{ color:var(--texto-suave); }
  .resumen-row .v{ font-weight:700; color:var(--morado-oscuro); text-align:right; }

  .split-bar{ display:flex; width:100%; height:34px; border-radius:12px; overflow:hidden; background:rgba(126,132,174,0.12); margin:10px 0; }
  .split-seg{ display:flex; align-items:center; justify-content:center; color:#fff; font-size:11.5px; font-weight:800; white-space:nowrap; overflow:hidden; }
  .split-legend{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--texto-suave); margin-top:2px; }

  .jardin-list{ display:flex; flex-direction:column; gap:8px; margin:10px 0 4px; }
  .jardin-item{ display:flex; align-items:center; gap:10px; background:var(--superficie); border-radius:14px; padding:10px 13px; font-size:13.5px; }
  .jardin-swatch{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .jardin-label{ flex:1; font-weight:700; color:var(--morado-oscuro); }
  .jardin-val{ color:var(--texto-suave); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }

  table.matriz{ width:100%; border-collapse:collapse; font-size:12.5px; margin:10px 0; }
  table.matriz th, table.matriz td{ padding:8px 6px; text-align:center; border-bottom:1px solid rgba(126,132,174,0.15); }
  table.matriz th{ color:var(--morado-suave); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  table.matriz td.horiz{ text-align:left; color:var(--texto-suave); }
  table.matriz tr.fila-activa td{ background:linear-gradient(135deg, rgba(194,203,255,0.5), rgba(206,162,221,0.35)); font-weight:800; color:var(--morado-oscuro); border-radius:8px; }
  :root[data-theme="dark"] table.matriz tr.fila-activa td, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) table.matriz tr.fila-activa td{ background:linear-gradient(135deg, rgba(194,203,255,0.16), rgba(206,162,221,0.12)); } }
  .matriz-wrap{ overflow-x:auto; }

  .rango-box{ background:rgba(223,243,175,0.35); border-radius:18px; padding:16px 18px; margin:14px 0; }
  :root[data-theme="dark"] .rango-box, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .rango-box{ background:rgba(223,243,175,0.08); } }
  .rango-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .rango-grid label{ font-size:12px; margin:0 0 4px; }
  .suma-check{ text-align:center; font-size:13px; font-weight:700; margin-top:10px; padding:8px; border-radius:10px; }
  .suma-ok{ background:rgba(62,143,99,0.15); color:var(--bien); }
  .suma-mal{ background:rgba(178,74,114,0.12); color:var(--alerta); }

  .microcopy{ font-size:13px; color:var(--morado-oscuro); background:rgba(194,203,255,0.35); border-radius:14px; padding:12px 16px; margin:0 0 16px; }
  :root[data-theme="dark"] .microcopy, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .microcopy{ background:rgba(194,203,255,0.1); } }
  .tip{ background:var(--superficie); border-radius:14px; padding:12px 15px; margin-bottom:9px; font-size:13.5px; border-left:4px solid var(--morado); }
  .footer-nota{ text-align:center; font-size:12px; color:var(--morado-suave); margin-top:18px; line-height:1.5; }

  .progreso{ margin-top:20px; }
  .paso-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:8px; }
  .paso-dot{ width:8px; height:8px; border-radius:50%; background:rgba(126,132,174,0.22); }
  .paso-dot.activo{ background:var(--morado); }
  .paso-texto{ text-align:center; font-size:12px; color:var(--morado-suave); }

  .final-hero{ text-align:center; background:linear-gradient(135deg, rgba(194,203,255,0.55), rgba(206,162,221,0.45)); border-radius:22px; padding:22px 18px; margin-bottom:14px; }
  :root[data-theme="dark"] .final-hero, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .final-hero{ background:linear-gradient(135deg, rgba(194,203,255,0.14), rgba(206,162,221,0.12)); } }
  .final-hero .rotulo{ font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--morado-oscuro); font-weight:700; }
  .final-hero .pagina{ font-size:13px; color:var(--morado-oscuro); opacity:.75; margin-top:4px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--morado-oscuro); color:#fff; padding:12px 18px; border-radius:14px; font-size:14px; z-index:99; max-width:90%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
</style>

function bucketHorizonte(metaHorizonte){
  if(metaHorizonte === "Entre 3 y 7 años") return "Mediano";
  if(metaHorizonte === "Más de 7 años") return "Largo";
  return "Corto"; // "Menos de 1 año" y "Entre 1 y 3 años"
}
function filaMatriz(perfil, horizonte){
  return MATRIZ.find(f => f.perfil === perfil && f.horizonte === horizonte);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function cop(v){ v = Number(v)||0; const signo = v<0?"-":""; return signo + "$" + Math.round(Math.abs(v)).toLocaleString("es-CO"); }
function esc(s){ return (s||"").toString().replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function findPersona(email){
  const key = (email||"").trim().toLowerCase();
  return DATASET.find(p => p.email.trim().toLowerCase() === key) || null;
}
function estructuralInvertible(p){
  const estructural = p.activo_viviendaPropia_cop + p.activo_viviendaInversion_cop + p.activo_pension_cop + p.activo_negocio_cop + p.activo_vehiculo_cop + p.activo_otrosActivos_cop;
  const invertible = p.activo_liquidez_cop + p.activo_rentaFija_cop + p.activo_mercado_cop;
  return { estructural, invertible, total: estructural + invertible };
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}
function header(){
  return `<div class="brand"><img src="data:image/png;base64,${ICON_B64}" alt="Feminario"></div>
  <div class="eyebrow">Sesión 1 · Tu Portafolio, Tu Estrategia</div>
  <div class="titulo-tool">Mi Rango Objetivo</div>`;
}
function progreso(paso, total, texto){
  let dots = "";
  for(let i=1;i<=total;i++){ dots += `<span class="paso-dot ${i<=paso?'activo':''}"></span>`; }
  return `<div class="progreso"><div class="paso-dots">${dots}</div><div class="paso-texto">${texto}</div></div>`;
}

      ${mensajeError ? `<div class="microcopy" style="background:rgba(178,74,114,0.12); color:var(--alerta);">${mensajeError}</div>` : ""}
      <button class="btn" onclick="buscarPersona()">Buscar mi resultado</button>
      <div class="footer-nota">¿Aún no llenaste tu Balance de Portafolio? <a href="${LINK_BALANCE_PORTAFOLIO}" target="_blank" rel="noopener" style="color:var(--morado);">Hazlo aquí primero</a>, y luego vuelve a esta página.</div>
    </div>
  `;
  document.getElementById("in-email").addEventListener("keydown", e => { if(e.key==="Enter") buscarPersona(); });
}
function buscarPersona(){
  const email = document.getElementById("in-email").value.trim();
  if(!email){ pantallaBusqueda("Escribe tu correo para poder buscar tu resultado 💛"); return; }
  const persona = findPersona(email);
  if(!persona){
    pantallaBusqueda("No encontramos un resultado con ese correo. Revisa que esté bien escrito, o completa primero tu Balance de Portafolio.");
    return;
  }
  sesion.persona = persona;
  sesion.horizonte = bucketHorizonte(persona.metaHorizonte);
  sesion.split = estructuralInvertible(persona);
  pantallaResumen();
}

/* ============================================================
   PANTALLA 2 — RESUMEN DE SU BALANCE
   ============================================================ */
function pantallaResumen(){
  const p = sesion.persona;
  const fecha = new Date(p.fecha).toLocaleDateString("es-CO", { day:"numeric", month:"long", year:"numeric" });
  document.getElementById("app").innerHTML = `
    ${header()}
    <div class="card">
      <p class="lead">Hola de nuevo, ${esc(p.nombre.split(" ")[0])} 👋</p>
      <h2>Este es tu punto de partida</h2>
      <div class="resumen-row"><span class="k">Tu último corte</span><span class="v">${fecha}</span></div>
      <div class="resumen-row"><span class="k">Perfil de riesgo</span><span class="v">${esc(p.perfilRiesgoCategoria)}</span></div>
      <div class="resumen-row"><span class="k">Tu meta principal</span><span class="v">${esc(p.metaPrincipal)}</span></div>
      <div class="resumen-row"><span class="k">En cuánto tiempo</span><span class="v">${esc(p.metaHorizonte)}</span></div>
      <div class="resumen-row"><span class="k">Patrimonio neto</span><span class="v">${cop(p.patrimonioNeto_cop)}</span></div>
      <button class="btn" onclick="pantallaSplit()">Empezar el ejercicio</button>
      <button class="link-volver" onclick="pantallaBusqueda()">← Buscar con otro correo</button>
      ${progreso(1,4,"Paso 1 de 4 · Tu punto de partida")}
    </div>
  `;
}

/* ============================================================
   PANTALLA 3 — ESTRUCTURAL VS. INVERTIBLE
   ============================================================ */
function pantallaSplit(){
  const s = sesion.split;
  const pctInv = s.total > 0 ? Math.round((s.invertible/s.total)*100) : 0;
  const pctEst = 100 - pctInv;
  document.getElementById("app").innerHTML = `
    ${header()}
    <div class="card">
      <h2>Antes de empezar: no toda tu plata entra al ejercicio</h2>
      <p>Separa tu patrimonio en dos partes. El ejercicio de hoy trabaja solo sobre la que sí puedes mover activamente.</p>
      <div class="split-bar">
        ${s.estructural>0 ? `<div class="split-seg" style="width:${pctEst}%; background:var(--morado-suave);">${pctEst}%</div>` : ""}
        ${s.invertible>0 ? `<div class="split-seg" style="width:${pctInv}%; background:var(--morado);">${pctInv}%</div>` : ""}
      </div>
      <div class="split-legend"><span>Estructural</span><span>Invertible activamente</span></div>

      <h3>Estructural — ${cop(s.estructural)}</h3>
      <p style="font-size:13.5px; color:var(--texto-suave);">Vivienda propia, pensión, negocio propio, vehículo y otros bienes. Cuenta en tu panorama completo, pero no se reasigna hoy.</p>

      <h3>Invertible activamente — ${cop(s.invertible)}</h3>
      <p style="font-size:13.5px; color:var(--texto-suave);">Liquidez, renta fija e inversión de mercado. Sobre esto trabaja tu rango objetivo.</p>

      <div class="microcopy">💡 Si dentro de tu categoría de pensión tienes pensión voluntaria, para efectos de este ejercicio cuenta esa parte como invertible — el resto (pensión obligatoria) sí es estructural.</div>

      <button class="btn" onclick="pantallaHorizonte()">Siguiente: tu horizonte</button>
      <button class="link-volver" onclick="pantallaResumen()">← Volver</button>
      ${progreso(2,4,"Paso 2 de 4 · Estructural vs. invertible")}
    </div>
  `;
}

/* ============================================================
   PANTALLA 4 — HORIZONTE
   ============================================================ */
function pantallaHorizonte(){
  const p = sesion.persona;
  document.getElementById("app").innerHTML = `
    ${header()}
    <div class="card">
      <h2>El horizonte le puede ganar al perfil</h2>
      <p>Si tu meta está cerca, tu horizonte manda — sin importar qué tan cómoda te sientas con el riesgo. Tu meta es <b>"${esc(p.metaPrincipal)}"</b> en <b>${esc(p.metaHorizonte).toLowerCase()}</b>, así que te ubicamos aquí:</p>
      <div class="opciones" id="op-horizonte">
        ${HORIZONTES.map(h => `<div class="opcion ${sesion.horizonte===h?'sel':''}" onclick="elegirHorizonte('${h}')">${HORIZONTE_LABEL[h]}</div>`).join("")}
      </div>
      <div class="microcopy">💡 Si sientes que tu meta está más próxima de lo que sugiere tu test, muévete a un horizonte más corto acá. Eso te acerca al lado más conservador de tu fila en la matriz.</div>
      <button class="btn" onclick="pantallaMatriz()">Ver mi rango de referencia</button>
      <button class="link-volver" onclick="pantallaSplit()">← Volver</button>
      ${progreso(3,4,"Paso 3 de 4 · Tu horizonte")}
    </div>
  `;
}
function elegirHorizonte(h){
  sesion.horizonte = h;
  document.querySelectorAll("#op-horizonte .opcion").forEach((el,i)=> el.classList.toggle("sel", HORIZONTES[i]===h));
}

/* ============================================================
   PANTALLA 5 — MATRIZ + RANGO SUGERIDO
   ============================================================ */
function pantallaMatriz(){
  const p = sesion.persona;
  const fila = filaMatriz(p.perfilRiesgoCategoria, sesion.horizonte);
  const mid = (r)=> Math.round((r[0]+r[1])/2);
  // rv y rf se redondean normalmente; liq se calcula como residuo para
  // garantizar que los tres valores por defecto siempre sumen 100%
  // (redondear cada punto medio por separado puede no sumar 100).
  const rvDef = mid(fila.rv), rfDef = mid(fila.rf), liqDef = 100 - rvDef - rfDef;
  document.getElementById("app").innerHTML = `
    ${header()}
    <div class="card">
      <h2>Tu punto de partida — perfil × horizonte</h2>
      <p style="font-size:13.5px; color:var(--texto-suave);">Es un punto de partida, no una fórmula rígida. Tu fila está resaltada abajo.</p>
      <div class="matriz-wrap">
        <table class="matriz">
          <tr><th>Perfil</th><th class="horiz">Horizonte</th><th>R. variable</th><th>R. fija</th><th>Liquidez</th></tr>
          ${MATRIZ.map(f => `
            <tr class="${f.perfil===p.perfilRiesgoCategoria && f.horizonte===sesion.horizonte ? 'fila-activa':''}">
              <td>${f.perfil}</td>
              <td class="horiz">${HORIZONTE_LABEL[f.horizonte]}</td>
              <td>${f.rv[0]}-${f.rv[1]}%</td>
              <td>${f.rf[0]}-${f.rf[1]}%</td>
              <td>${f.liq[0]}-${f.liq[1]}%</td>
            </tr>
          `).join("")}
        </table>
      </div>

      <div class="rango-box">
        <b style="color:var(--morado-oscuro);">Tu rango sugerido:</b> Renta variable ${fila.rv[0]}-${fila.rv[1]}% · Renta fija ${fila.rf[0]}-${fila.rf[1]}% · Liquidez ${fila.liq[0]}-${fila.liq[1]}%
      </div>

      <h3>Así se traduce a tu jardín</h3>
      <div class="jardin-list">
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--tronco)"></span><span class="jardin-label">Tronco + Ramas</span><span class="jardin-val">= Renta variable</span></div>
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--raices)"></span><span class="jardin-label">Raíces</span><span class="jardin-val">= Renta fija</span></div>
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--agua)"></span><span class="jardin-label">Reserva de agua</span><span class="jardin-val">= Liquidez</span></div>
      </div>

      <div class="microcopy">🌱 Regla aparte, sin importar tu perfil: tu <b>injerto</b> (cripto, tu propio emprendimiento) no debería superar el <b>5-10%</b> de tu portafolio total.</div>

      <button class="btn" onclick="pantallaFinal(${rvDef}, ${rfDef}, ${liqDef})">Definir mi rango final</button>
      <button class="link-volver" onclick="pantallaHorizonte()">← Volver</button>
      ${progreso(4,4,"Paso 4 de 4 · Tu rango de referencia")}
    </div>
  `;
}

/* ============================================================
   PANTALLA 6 — DEFINIR RANGO FINAL
   ============================================================ */
function pantallaFinal(rv, rf, liq){
  const p = sesion.persona;
  document.getElementById("app").innerHTML = `
    ${header()}
    <div class="card">
      <h2>Escribe tu rango objetivo final</h2>
      <p style="font-size:13.5px; color:var(--texto-suave);">Ajusta con tu propio criterio dentro (o cerca) del rango sugerido. Debe sumar 100%.</p>
      <div class="rango-grid">
        <div><label>Renta variable %</label><input type="number" id="in-rv" value="${rv}" min="0" max="100" oninput="chequearSuma()"></div>
        <div><label>Renta fija %</label><input type="number" id="in-rf" value="${rf}" min="0" max="100" oninput="chequearSuma()"></div>
        <div><label>Liquidez %</label><input type="number" id="in-liq" value="${liq}" min="0" max="100" oninput="chequearSuma()"></div>
      </div>
      <div id="suma-indicador"></div>

      <label>Injerto (cripto, emprendimiento propio) — opcional, aparte del 100%</label>
      <input type="number" id="in-injerto" value="0" min="0" max="100" placeholder="0">
      <small class="help">Recuerda: no debería superar 5-10% de tu portafolio total.</small>

      <label>¿Ajustaste algo por tu meta, o te quedaste con lo que decía la matriz? (opcional)</label>
      <textarea id="in-nota" placeholder="Ej: me moví más conservadora porque mi meta está muy cerca..."></textarea>

      <button class="btn" id="btn-guardar" onclick="guardarRango()">Guardar mi rango objetivo</button>
      <button class="link-volver" onclick="pantallaMatriz()">← Volver</button>
    </div>
  `;
  chequearSuma();
}
function chequearSuma(){
  const rv = Number(document.getElementById("in-rv").value)||0;
  const rf = Number(document.getElementById("in-rf").value)||0;
  const liq = Number(document.getElementById("in-liq").value)||0;
  const suma = rv+rf+liq;
  const el = document.getElementById("suma-indicador");
  const btn = document.getElementById("btn-guardar");
  if(suma === 100){
    el.innerHTML = `<div class="suma-check suma-ok">Suma 100% ✓</div>`;
    btn.disabled = false;
  } else {
    el.innerHTML = `<div class="suma-check suma-mal">Suma ${suma}% — ajusta para que dé 100%</div>`;
    btn.disabled = true;
  }
}

/* ============================================================
   GUARDAR + ENVIAR A SHEET
   ============================================================ */
function enviarABaseDeDatos(payload){
  if(!SHEET_WEBAPP_URL){ console.log("[Mi Rango Objetivo] Sin SHEET_WEBAPP_URL configurada. Datos no enviados:", payload); return; }
  fetch(SHEET_WEBAPP_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) })
    .catch(err => console.log("[Mi Rango Objetivo] Error al enviar:", err));
}
function guardarRango(){
  const rv = Number(document.getElementById("in-rv").value)||0;
  const rf = Number(document.getElementById("in-rf").value)||0;
  const liq = Number(document.getElementById("in-liq").value)||0;
  if(rv+rf+liq !== 100){ toast("Tu rango debe sumar 100% 💛"); return; }
  const injerto = Number(document.getElementById("in-injerto").value)||0;
  const nota = document.getElementById("in-nota").value.trim();

  sesion.rango = { rv, rf, liq, injerto, nota };
  const p = sesion.persona;
  const s = sesion.split;

  enviarABaseDeDatos({
    tipo: "sesion1_rango_objetivo",
    fecha: new Date().toISOString(),
    fechaSesionLabel: FECHA_SESION_LABEL,
    nombre: p.nombre, email: p.email,
    perfilRiesgo: p.perfilRiesgoCategoria,
    metaPrincipal: p.metaPrincipal, metaHorizonteOriginal: p.metaHorizonte,
    horizonteElegido: sesion.horizonte,
    estructural_cop: s.estructural, invertible_cop: s.invertible, patrimonioNeto_cop: p.patrimonioNeto_cop,
    rango_rentaVariable_pct: rv, rango_rentaFija_pct: rf, rango_liquidez_pct: liq,
    injerto_pct: injerto, nota: nota
  });

  pantallaConfirmacion();
}

/* ============================================================
   PANTALLA 7 — CONFIRMACIÓN
   ============================================================ */
function pantallaConfirmacion(){
  const p = sesion.persona, r = sesion.rango;
  document.getElementById("app").innerHTML = `
    ${header()}
    <div class="card">
      <div class="final-hero">
        <div class="rotulo">Página 1 · Mi Estrategia de Inversión</div>
        <div class="pagina">${esc(p.nombre)} · ${FECHA_SESION_LABEL}</div>
      </div>

      <div class="jardin-list">
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--tronco)"></span><span class="jardin-label">Renta variable (tronco + ramas)</span><span class="jardin-val">${r.rv}%</span></div>
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--raices)"></span><span class="jardin-label">Renta fija (raíces)</span><span class="jardin-val">${r.rf}%</span></div>
        <div class="jardin-item"><span class="jardin-swatch" style="background:var(--agua)"></span><span class="jardin-label">Liquidez (reserva de agua)</span><span class="jardin-val">${r.liq}%</span></div>
        ${r.injerto>0 ? `<div class="jardin-item"><span class="jardin-swatch" style="background:var(--injerto)"></span><span class="jardin-label">Injerto (cripto / emprendimiento)</span><span class="jardin-val">${r.injerto}%</span></div>` : ""}
      </div>

      <div class="resumen-row"><span class="k">Perfil de riesgo</span><span class="v">${esc(p.perfilRiesgoCategoria)}</span></div>
      <div class="resumen-row"><span class="k">Horizonte usado</span><span class="v">${HORIZONTE_LABEL[sesion.horizonte]}</span></div>
      ${r.nota ? `<div class="tip">"${esc(r.nota)}"</div>` : ""}

      <p style="font-size:14px; margin-top:16px;">Hoy dejaste de improvisar. La próxima sesión — <b>15 de octubre</b> — eligen las semillas concretas para cada parte del jardín, y revisan si lo que ya tienen sembrado está realmente diversificado.</p>

      <button class="btn secundario" onclick="pantallaFinal(sesion.rango.rv, sesion.rango.rf, sesion.rango.liq)">Editar mi rango</button>
      <div class="footer-nota">Tu rango quedó guardado. Este es el primer pedazo del documento que vas a seguir construyendo en las próximas sesiones.</div>
    </div>
  `;
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
pantallaBusqueda();
</script>
